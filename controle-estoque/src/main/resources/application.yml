spring:
  # Configuração do banco em memória H2 e do Console Visual
  h2:
    console:
      enabled: true
      path: /h2-console

  # Configuração da conexão com o banco de dados
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  # Configurações do JPA e Hibernate
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true # mostra os comandos SQL executados no Console